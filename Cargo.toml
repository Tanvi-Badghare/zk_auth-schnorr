[package]
name = "zk-auth"
version = "0.1.0"
edition = "2021"
description = "Research-grade Zero-Knowledge Authentication using Schnorr proofs and the Fiat–Shamir heuristic"
authors = ["Tanvi Badghare"]
license = "MIT"
repository = "https://github.com/Tanvi-Badghare/zk-auth"
readme = "README.md"
keywords = ["zero-knowledge", "authentication", "schnorr", "cryptography"]
categories = ["cryptography", "authentication"]

[lib]
name = "zk_auth"
path = "src/lib.rs"

[[bin]]
name = "zk-auth"
path = "src/main.rs"

[dependencies]
thiserror = "1"
serde_json = "1"
sha2 = "0.10"
digest = "0.10"
serde = { version = "1", features = ["derive"] }
curve25519-dalek = { version = "4", default-features = false, features = ["alloc", "serde", "rand_core", "zeroize"] }
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
hex = "0.4"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "schnorr_bench"
path = "benches/schnorr_bench.rs"
harness = false

[[bench]]
name = "auth_bench"
path = "benches/auth_bench.rs"
harness = false

[[bench]]
name = "end_to_end_bench"
path = "benches/end_to_end_bench.rs"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev.package."*"]
opt-level = 1